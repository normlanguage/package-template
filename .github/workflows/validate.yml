name: Validate package

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: normlanguage/registry/.github/actions/setup-norm@90b4d247fa4f5f2b620924d2cbc0553e89843700
        with:
          version: 0.27.23
      - name: Generate and validate Skill
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'example_package' module.norm; then
            test -s SKILL.md
            exit 0
          fi
          norm docs . --output build/api --skill SKILL.md --strict
          test -s SKILL.md
